<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#27272a" stroke-width="8" />

  <!-- Outer frame (Thumbnail aspect 16:9 inner) -->
  <rect x="56" y="96" width="400" height="240" rx="24" fill="#000000" stroke="#dc2626" stroke-width="8" />
  
  <!-- Screen split 3 panels -->
  <line x1="189" y1="96" x2="189" y2="336" stroke="#ef4444" stroke-width="4" />
  <line x1="322" y1="96" x2="322" y2="336" stroke="#ef4444" stroke-width="4" />
  
  <!-- Top Banner Red in thumbnail -->
  <rect x="56" y="96" width="400" height="54" rx="20" fill="url(#redGrad)" />
  <!-- Sub Banner Green -->
  <rect x="56" y="150" width="400" height="42" fill="#065f46" />
  
  <!-- Play button glowing in center -->
  <circle cx="256" cy="245" r="42" fill="url(#redGrad)" filter="url(#glow)" />
  <polygon points="246,225 278,245 246,265" fill="#ffffff" />

  <!-- 4K Badge floating -->
  <rect x="80" y="380" width="160" height="60" rx="14" fill="url(#goldGrad)" />
  <text x="160" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-1">4K UHD</text>

  <!-- YouTube Play icon pill -->
  <rect x="260" y="380" width="172" height="60" rx="14" fill="#dc2626" />
  <text x="346" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">STUDIO</text>
</svg>
